services:
  postgres:
    image: postgres:16
    container_name: mindfulness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mindfulness}
      POSTGRES_USER: ${DB_USER:-mindfulness}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mindfulness}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mindfulness} -d ${DB_NAME:-mindfulness}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      target: dev
    container_name: mindfulness-backend
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      target: dev
    container_name: mindfulness-frontend
    env_file: ./frontend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
